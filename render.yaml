# ---------------------------------------------------------------
# Render Infrastructure-as-Code
# Deploys ToursTravel Kenya (Laravel) as a Docker web service.
#
# HOW TO USE:
#   1. Push this repo to GitHub.
#   2. In Render: "New +" → "Blueprint" → connect this repository.
#   3. Render will create the web service.
#   4. Provision an external PostgreSQL database (e.g. Supabase, Neon, Railway).
#   5. In the Render dashboard → your service → Environment, set the DB_* variables
#      from your external PostgreSQL provider, plus APP_KEY.
# ---------------------------------------------------------------

services:
  - type: web
    name: tours-travel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: ToursTravel Kenya
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://tours-travel-xp15.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: "db.ikbzpkswgvpwpheyafbv.supabase.co"
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: "postgres"
      - key: DB_USERNAME
        value: "postgres"
      - key: DB_PASSWORD
        value: "REPLACE_ME"      # <-- SET as Secret in Render dashboard (your Supabase password)
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
