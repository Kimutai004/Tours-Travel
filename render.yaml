# ---------------------------------------------------------------
# Render Infrastructure-as-Code
# Deploys ToursTravel Kenya (Laravel) as a Docker web service.
#
# HOW TO USE:
#   1. Push this repo to GitHub.
#   2. In Render: "New +" → "Blueprint" → connect this repository.
#   3. Render will create the web service + PostgreSQL database.
#   4. Set APP_KEY in the Render dashboard (from `php artisan key:generate --show`).
# ---------------------------------------------------------------

services:
  - type: web
    name: tours-travel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: ToursTravel Kenya
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://tours-travel-xp15.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tours-travel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tours-travel-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tours-travel-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tours-travel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tours-travel-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: tours-travel-db
    plan: free
